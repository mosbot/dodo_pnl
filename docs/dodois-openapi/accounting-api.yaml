          description: Заказ успешно отправлен
        '400':
          description: |-
            #### Некорректный запрос.

            Возможные коды ошибок поля code:
            - `ValidationError` — общая ошибка валидации

            Коды ошибок блока `details.errors`:
            - `Required` — не передано обязательное поле
            - `InvalidValue` — передано недопустимое значение параметра
            - `ValueTooSmall` — значение меньше минимально допустимого
            - `ValueTooLarge` — значение превышает максимально допустимое
            - `InvalidEntityState` — заказ не может быть отправлен в текущем статусе; ожидаемые статусы: `Confirmed`, `Sent`
            - `InvalidValue` (поле `items`) — переданы неправильные позиции заказа: позиция не принадлежит заказу, либо переданы дубликаты `stockItemId`; см. детали в сообщении
          content:
