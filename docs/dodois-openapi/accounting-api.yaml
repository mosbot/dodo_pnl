  '/manufactures/{manufactureId}/orders':
    get:
      operationId: get-manufacture-orders
      summary: Мануфактуры → Заказы кофеен
      description: |-
        Возвращает список заказов кофеен, адресованных указанной мануфактуре, изменённых с момента `modifiedAt` (включительно), отсортированных по возрастанию даты изменения.

        Получение всего списка выполняется следующим образом:
        - В первом запросе в качестве `modifiedAt` рекомендуется использовать наиболее раннее значение `0001-01-01T00:00:00.000000Z`;
        - Затем необходимо использовать `modifiedAt` последней записи из предыдущего ответа в качестве значения параметра `modifiedAt` следующего запроса;
        - Повторять до достижения `isEndOfListReached = true`.

        При необходимости получить только записи, обновлённые с какого-то момента времени (включительно), в первом запросе в качестве `modifiedAt` отправляется соответствующая дата.

        Запись может быть получена несколько раз до достижения конца списка `isEndOfListReached = true`:
          - если запись была изменена в процессе получения списка;
          - если запись расположена на границе запросов, то она будет возвращена и в первом, и во втором запросе, так как выборка данных для следующего запроса выполняется по условию "дата изменения" >= modifiedAt.

        Гарантирует получение всех изменений сущности, но требует дедупликации возвращённых результатов на границе страниц.

        Возвращаются заказы во всех статусах. Опционально можно фильтровать по статусу с помощью параметра `statuses`.

        В составе заказа возвращаются только актуальные позиции. Позиция, которую мануфактура не подтвердила или не отправила, либо которую не приняла кофейня, в составе заказа не возвращается.

        > #### Доступно для следующих ролей:
        >
        >   `Division administrator` - Администратор подразделения
      tags:
        - _in_development
      parameters:
        - name: manufactureId
          in: path
          required: true
          description: Уникальный идентификатор мануфактуры
          schema:
            $ref: '#/components/schemas/Id'
        - $ref: '#/components/parameters/requiredModifiedAt'
        - $ref: '#/components/parameters/take'
        - name: statuses
          in: query
          required: false
          description: |-
            Фильтр по статусам заказа. Если не указан, возвращаются заказы во всех статусах.

            Можно передать несколько статусов через запятую: `?statuses=Created,Confirmed`.

            Допустимые значения:
              - `Created` — создан
              - `Confirmed` — подтверждён мануфактурой
              - `Sent` — отправлен
              - `Delivered` — доставлен
          schema:
            type: string
            enum:
              - Created
              - Confirmed
              - Sent
              - Delivered
            example: 'Created,Confirmed'
      responses:
        '200':
          description: |-
            OK. Возвращает список заказов кофеен для мануфактуры.

            Если мануфактура существует, но заказов нет, возвращается объект ответа, в котором поле `orders` содержит пустой список `[]`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetManufactureOrdersResponse'
              examples:
                hasOrders:
                  summary: Есть заказы кофеен
                  value:
                    orders:
                      - id: 000d3a240c719a8711e68aba13f7f862
                        unitId: 111d3a240c719a8711e68aba13f7f863
                        status: Created
                        createdAt: '2024-03-15T09:00:00.000000Z'
                        plannedDate: '2024-03-18'
                        modifiedAt: '2024-03-15T09:00:00.000000Z'
                        items:
                          - stockItemId: aaa1a240c719a8711e68aba13f7f111
                            containerId: 000d3a240c719a8711e68aba13f7f863
                            quantity: 10.5
                            measurementUnit: Kilogram
                          - stockItemId: bbb2b240c719a8711e68aba13f7f222
                            containerId: null
                            quantity: 3
                            measurementUnit: Liter
                    isEndOfListReached: true
                noOrders:
                  summary: Заказов нет
                  value:
                    orders: []
                    isEndOfListReached: true
        '400':
          description: |-
            #### Некорректный запрос.

            Коды ошибок блока errors:
              - `Required` - не передано обязательное поле
              - `ValueTooSmall` - значение меньше минимально допустимого
              - `ValueTooLarge` - значение превышает максимально допустимое
              - `InvalidValue` - передано недопустимое значение параметра
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorContractBadRequest'
        '401':
          description: '#### Пользователь не авторизован'
        '403':
          description: |-
            #### Недостаточно прав

            Коды ошибок:
            - `InsufficientRoles` - отсутствует необходимая роль для выполнения запроса
            - `InsufficientScopes` - нет доступа к api. В токене не передан необходимый scope
            - `NoAccessToUnit` - нет доступа к заведению
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorContract'
        '404':
          description: |-
            #### Мануфактура не найдена

            Возвращается если мануфактуры с переданным manufactureId не существует
        '500':
          description: |-
            #### Внутренняя ошибка сервера

            Коды ошибок:
             - `InternalError` - внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorContract'
      security:
        - Dodo oauth2:
            - 'accounting:manufacture'
  '/manufactures/orders/{orderId}/confirm':
    post:
      operationId: post-manufacture-order-confirm
      summary: Мануфактуры → Подтверждение заказа внешней мануфактурой
      description: |-
        Подтверждение заказа кофейни мануфактурой

        В запросе должны содержаться все позиции, которые будут поставлены мануфактурой.

        Позицию, которая не может быть поставлена, можно **не передавать** в запросе либо передать с `quantity: 0` — оба варианта равнозначны. 
        После этого позиция считается удалённой из заказа и не будет возвращена в эндпоинте получения заказов.

        Удалённую позицию нельзя подтвердить повторно с количеством больше 0 — такая позиция
        считается не принадлежащей заказу.

        Хотя бы одна позиция должна быть подтверждена с количеством больше 0.

        Заказ можно подтверждать повторно, пока он не отправлен: каждое повторное
        подтверждение заменяет ранее подтверждённые количества, состав заказа
        определяется последним подтверждением, непереданные позиции (или переданные с 0) считаются удалёнными.

        > #### Доступно для следующих ролей:
        >
        >   `Division administrator` — Администратор подразделения
      tags:
        - _in_development
      parameters:
        - name: orderId
          in: path
          required: true
          description: Уникальный идентификатор заказа
          schema:
            $ref: '#/components/schemas/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmManufactureOrderRequest'
            examples:
              twoItems:
                summary: Подтверждение заказа с двумя позициями
                value:
                  at: '2026-06-26T10:00:00.000000Z'
                  items:
                    - stockItemId: 0198f3c2a1b2c3d4e5f6a7b8c9d0e1f2
                      quantity: 12
                      totalPriceWithVat: 120
                      totalPriceWithoutVat: 100
                      unitPriceWithVat: 10
                      unitPriceWithoutVat: 8.33
                      vatRate: 20
                    - stockItemId: 0298f3c2a1b2c3d4e5f6a7b8c9d0e1f3
                      quantity: 5
                      totalPriceWithVat: 60
                      totalPriceWithoutVat: 50
                      unitPriceWithVat: 12
                      unitPriceWithoutVat: 10
                      vatRate: 20
              partialItems:
                summary: Подтверждение части позиций заказа
                description: |-
                  В заказе было три позиции. Мануфактура подтверждает только первую: вторая не передана, третья передана с `quantity: 0`.
                  Обе неподтверждённые позиции не будут поставлены.
                value:
                  at: '2026-06-26T10:00:00.000000Z'
                  items:
                    - stockItemId: 0198f3c2a1b2c3d4e5f6a7b8c9d0e1f2
                      quantity: 12
                      totalPriceWithVat: 120
                      totalPriceWithoutVat: 100
                      unitPriceWithVat: 10
                      unitPriceWithoutVat: 8.33
                      vatRate: 20
                    - stockItemId: 0398f3c2a1b2c3d4e5f6a7b8c9d0e1f4
                      quantity: 0
                      totalPriceWithVat: 0
                      totalPriceWithoutVat: 0
                      unitPriceWithVat: 0
                      unitPriceWithoutVat: 0
                      vatRate: 20
      responses:
        '204':
          description: Заказ успешно подтверждён.
        '400':
          description: |-
            #### Некорректный запрос.

            Коды ошибок поля `code`:
            - `ValidationError` — общая ошибка валидации

            Коды ошибок блока `details.errors`:
            - `Required` — не передано обязательное поле
            - `InvalidValue` — передано недопустимое значение параметра
            - `ValueTooSmall` — значение меньше минимально допустимого
            - `ValueTooLarge` — значение превышает максимально допустимое
            - `InvalidEntityState` — заказ не может быть подтверждён в текущем статусе; статусы, в которых возможно подтверждение: `Created`, `RequestedCorrection`, `Confirmed`
            - `InvalidValue` (поле `items`) — ни одна позиция не подтверждена с количеством больше 0, либо переданы дубликаты `stockItemId`; см. детали в сообщении
            - `InvalidValue` (поле `items.stockItemId`) — переданная позиция не принадлежит заказу
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorContractBadRequest'
        '401':
          description: '#### Пользователь не авторизован'
        '403':
          description: |-
            #### Недостаточно прав

            Коды ошибок:
            - `InsufficientRoles` — отсутствует необходимая роль для выполнения запроса
            - `InsufficientScopes` — нет доступа к api. В токене не передан необходимый scope
            - `NoAccessToUnit` — нет доступа к заведению
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorContract'
        '404':
          description: |-
            #### Ресурс не найден

            Возможные причины:
            - Заказ с указанным `orderId` не существует
        '500':
          description: |-
            #### Внутренняя ошибка сервера

            Коды ошибок:
             - `InternalError` — внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorContract'
      security:
        - Dodo oauth2:
            - 'accounting:manufacture'
  '/manufactures/orders/{orderId}/send':
    post:
      operationId: post-manufacture-order-send
      summary: Мануфактуры → Отправка заказа кофейне
      description: |-
        Отправляет заказ из мануфактуры в кофейню.

        В запросе должны содержаться все позиции, которые были отправлены мануфактурой.

        Позицию, которая не будет отправлена, можно **не передавать** в запросе либо передать с `quantity: 0` — оба варианта равнозначны. 
        После этого позиция считается удалённой из заказа и не будет возвращена в эндпоинте получения заказов.

        Удалённую позицию нельзя отправить повторно с количеством больше 0 — такая позиция
        считается не принадлежащей заказу.

        Запрос, в котором все переданные позиции имеют `quantity: 0` или не передано ни одной позиции, валиден: заказ будет переведён в статус `Sent`,
        при этом ни одна позиция фактически не будет отправлена, в заказе не будет позиций.

        Заказ можно отправлять повторно, пока он не доставлен: каждая повторная отправка заменяет ранее
        отправленные количества, цены и время отправки.

        > #### Доступно для следующих ролей:
