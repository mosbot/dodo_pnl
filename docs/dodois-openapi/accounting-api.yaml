                    - stockItemId: 0298f3c2a1b2c3d4e5f6a7b8c9d0e1f3
                      quantity: 5
                      totalPriceWithVat: 60
                      totalPriceWithoutVat: 50
                      unitPriceWithVat: 12
                      unitPriceWithoutVat: 10
                      vatRate: 20
                      markingCodes:
                        - 010460778423244821JOB05_q93yBfa
              partialItems:
                summary: Отправка части позиций заказа
                description: |-
