      summary: Мануфактуры → Добавление доступного сырья
      description: |-
        Добавляет сырьё в список доступного сырья мануфактуры. После добавления сырьё становится доступным
        для заказа в клиентских заказах юнитов в указанную мануфактуру.

        Если сырьё уже присутствует в списке доступного сырья, операция завершается успешно без изменений, сырьё останется доступным.
        Удалённое (`isRemoved`), архивированное (`isArchived`) или несуществующее сырьё не может быть добавлено в список доступного сырья.
      tags:
        - _in_development
      parameters:
        - name: manufactureId
          in: path
          required: true
          description: Уникальный идентификатор мануфактуры
          schema:
            $ref: '#/components/schemas/Id'
        - name: stockItemId
          in: path
          required: true
          description: Уникальный идентификатор сырья
          schema:
            $ref: '#/components/schemas/Id'
      responses:
        '204':
          description: Сырьё успешно добавлено в список доступного сырья мануфактуры или уже было в нём
        '400':
          description: |-
            #### Некорректный запрос.

            Возможные коды ошибок поля code:
            - `ValidationError` — общая ошибка валидации

            Коды ошибок блока details.errors:
            - `EntityNotFound` — сырьё не существует
            - `EntityIsRemoved` — сырьё удалено и не может быть добавлено
            - `EntityIsArchived` — сырьё архивировано и не может быть добавлено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorContractBadRequest'
        '401':
          description: '#### Пользователь не авторизован'
        '403':
          description: |-
            #### Недостаточно прав

