      operationId: get-stock-items
      description: |-
        Возвращает список сырья.

        Если указан параметр `modifiedAt`, результат отсортирован по дате последнего изменения (`modifiedAt`) по возрастанию, а затем по идентификатору. Иначе — только по идентификатору.

        По умолчанию возвращает только федеральное сырьё. 

        Если указан параметр `units`, дополнительно возвращает локальное сырьё для указанных заведений.

        Поддерживается два способа пагинации:
        - **Offset-based:** нужно указывать параметр `skip`, смещая его на количество уже полученных записей. Повторять до тех пор, пока не будет достигнут конец списка (`isEndOfListReached = true`).
        - **Cursor-based:** нужно использовать `modifiedAt` последней записи из предыдущего ответа в качестве значения параметра `modifiedAt` следующего запроса. Повторять до `isEndOfListReached = true`.
        В обоих случаях нужно указывать `take` - сколько записей нужно получить.

        ### Требования к query параметрам:
        1. В `units` можно перечислить до 30 заведений в одном запросе
        2. В `units` следует перечислять UUID-ы строго через запятую без пробелов
        3. `modifiedAt` должен быть в формате ISO 8601 (UTC)
        4. `includeRemoved` и `includeArchived` — булевые значения, по умолчанию `false`
        5. `skip` должен быть не меньше 0, по умолчанию 0
        6. `take` должен быть от 1 до 1000, по умолчанию 100
      parameters:
        - name: units
          in: query
          required: false
          schema:
            type: string
            example: '000d3a240c719a8711e68aba13f7f862,000d3a240c719a8711e68aba13f7fc8a'
            pattern: '^[0-9a-f]{32}(,[0-9a-f]{32})*$'
            minLength: 32
            maxLength: 989
          description: 'Список заведений Dodo IS в формате UUID через запятую. Если указан, в ответ дополнительно включается локальное сырьё для этих заведений'
        - name: modifiedAt
          in: query
          required: false
          schema:
            type: string
            format: date-time
            example: '2025-01-15T10:30:00.000012Z'
          description: Фильтр по дате последнего изменения в формате ISO 8601 (UTC). Возвращает записи с `modifiedAt >= значение`. Используется для cursor-based пагинации
        - $ref: '#/components/parameters/includeRemoved'
        - $ref: '#/components/parameters/includeArchived'
        - $ref: '#/components/parameters/skip'
        - $ref: '#/components/parameters/takeLarge'
      security:
        - Dodo oauth2:
            - 'accounting:read'
  /manufactures/catalogs/stock-items/compositions:
    get:
      operationId: get-stock-items-compositions
      tags:
        - _in_development
      summary: Справочники → Составы сырья
      description: |-
        Возвращает список федеральных составов сырья, изменённых с момента `modifiedAt` (включительно), отсортированных по возрастанию даты изменения.

        В состав конкретного сырья входит информация о:
        - Идентификаторе сырья, чей состав изменился;
        - Дате изменения состава сырья;
        - Новом списке дочернего сырья, из которого состоит изменённое сырьё, с указанием количества дочернего сырья в единице родительского.

        Получение всего списка выполняется следующим образом:
        - В первом запросе в качестве `modifiedAt` рекомендуется использовать наиболее раннее значение `0001-01-01T00:00:00.000000Z`;
        - Затем необходимо использовать `modifiedAt` последней записи из предыдущего ответа в качестве значения параметра `modifiedAt` следующего запроса;
        - Повторять до достижения `isEndOfListReached = true`.

        При необходимости получить только записи, обновлённые с какого-то момента времени (включительно), в первом запросе в качестве `modifiedAt` отправляется соответствующая дата.

        Запись может быть получена несколько раз до достижения конца списка `isEndOfListReached = true`:
          - если запись была изменена в процессе получения списка;
          - если запись расположена на границе запросов, то она будет возвращена и в первом, и во втором запросе, так как выборка данных для следующего запроса выполняется по условию "дата изменения" >= modifiedAt.

        Гарантирует получение всех изменений сущности, но требует дедупликации возвращённых результатов на границе страниц.

        Сырьё без состава в общем случае не возвращается в этом эндпоинте. В частности, если у сырья был удалён состав в какой-то момент, то состав для такого сырья просто перестанет возвращаться в этом эндпоинте.

        Важное замечание: на текущий момент есть небольшой шанс, что сырьё с удалённым составом всё же вернётся здесь с пустым массивом в `stockItemsCompositions.composition`, такую ситуацию нужно обработать.
      parameters:
        - $ref: '#/components/parameters/requiredModifiedAt'
        - $ref: '#/components/parameters/takeLarge'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetStockItemsCompositionsResponse'
              example:
                stockItemsCompositions:
                  - stockItemId: 000d3a240c719a8711e68aba13f7f862
                    composition:
                      - stockItemId: 111d3a240c719a8711e68aba13f7f862
                        quantity: 350
                        netQuantity: 320
                        measurementUnit: Gram
                      - stockItemId: 222d3a240c719a8711e68aba13f7f862
                        quantity: 0.1
                        netQuantity: 0.095
                        measurementUnit: Liter
                    modifiedAt: '2024-03-15T14:30:00.000001Z'
                  - stockItemId: 333d3a240c719a8711e68aba13f7f862
                    composition:
                      - stockItemId: 444d3a240c719a8711e68aba13f7f862
                        quantity: 100
                        netQuantity: 90
                        measurementUnit: Quantity
                    modifiedAt: '2024-03-15T16:30:00.000002Z'
                isEndOfListReached: false
        '400':
          description: |-
            #### Некорректный запрос.

            Коды ошибок блока errors:
              - `Required` - не передано обязательное поле
              - `ValueTooSmall` - значение меньше минимально допустимого
              - `ValueTooLarge` - значение превышает максимально допустимое
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorContractBadRequest'
        '401':
          description: '#### Пользователь не авторизован'
        '403':
          description: |-
            #### Недостаточно прав

            Коды ошибок:
            - `InsufficientRoles` - отсутствует необходимая роль для выполнения запроса
            - `InsufficientScopes` - нет доступа к api. В токене не передан необходимый scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorContract'
        '500':
          description: |-
            #### Внутренняя ошибка сервера

            Коды ошибок:
             - `InternalError` - внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorContract'
      security:
        - Dodo oauth2:
            - 'accounting:manufacture'
