  '/manufactures/{manufactureId}/delivered':
    get:
      operationId: get-manufacture-delivered-orders
      summary: Мануфактуры → Факт приёма заказов
      description: |-
        Возвращает список заказов, принятых кофейней (статус `Delivered`), изменённых с момента `modifiedAt` (включительно), отсортированных по возрастанию даты изменения.

        Получение всего списка выполняется следующим образом:
        - В первом запросе в качестве `modifiedAt` рекомендуется использовать наиболее раннее значение `0001-01-01T00:00:00.000000Z`;
        - Затем необходимо использовать `modifiedAt` последней записи из предыдущего ответа в качестве значения параметра `modifiedAt` следующего запроса;
        - Повторять до достижения `isEndOfListReached = true`.

        При необходимости получить только записи, обновлённые с какого-то момента времени (включительно), в первом запросе в качестве `modifiedAt` отправляется соответствующая дата.

        Запись может быть получена несколько раз до достижения конца списка `isEndOfListReached = true`:
          - если запись была изменена в процессе получения списка;
          - если запись расположена на границе запросов, то она будет возвращена и в первом, и во втором запросе, так как выборка данных для следующего запроса выполняется по условию "дата изменения" >= modifiedAt.

        Гарантирует получение всех изменений сущности, но требует дедупликации возвращённых результатов на границе страниц.

        В составе заказа возвращаются фактически принятые кофейней количества. Отправленная позиция, которую кофейня не приняла, возвращается с количеством `0`. Позиция, которую мануфактура не подтвердила или не отправила, в составе заказа не возвращается.

        ### Окно редактирования приёмки

        После отгрузки заказа из мануфактуры кофейня может корректировать фактически принятые количества сырья до конца следующего дня с момента отгрузки (по местному времени кофейни).

        Пример: мануфактура отгрузила заказ 07.07.2026 в 07:35 — кофейня вправе вносить изменения до 08.07.2026 23:59 по местному времени.

        До истечения срока кофейня может вносить изменения **неограниченное количество раз**. После истечения срока изменения заказа невозможны.

        > #### Доступно для следующих ролей:
        >
        >   `Division administrator` - Администратор подразделения
      tags:
        - _in_development
      parameters:
        - name: manufactureId
          in: path
          required: true
          description: Уникальный идентификатор мануфактуры
          schema:
            $ref: '#/components/schemas/Id'
        - $ref: '#/components/parameters/requiredModifiedAt'
        - $ref: '#/components/parameters/take'
      responses:
        '200':
          description: |-
            OK. Возвращает список принятых заказов кофеен для мануфактуры.

            Если мануфактура существует, но принятых заказов нет, возвращается объект ответа, в котором поле `orders` содержит пустой список `[]`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetManufactureDeliveredOrdersResponse'
              examples:
                hasOrders:
                  summary: Есть принятые заказы
                  value:
                    orders:
                      - id: 000d3a240c719a8711e68aba13f7f862
                        unitId: 111d3a240c719a8711e68aba13f7f863
                        plannedDate: '2024-03-18'
                        deliveredAt: '2024-03-18T11:20:00.000000Z'
                        modifiedAt: '2024-03-18T11:20:00.000000Z'
                        claimLink: 'https://claims.example.com/claims/12345'
                        items:
                          - stockItemId: aaa1a240c719a8711e68aba13f7f111
                            quantity: 9.5
                          - stockItemId: bbb2b240c719a8711e68aba13f7f222
                            quantity: 3
                    isEndOfListReached: true
                noOrders:
                  summary: Принятых заказов нет
                  value:
                    orders: []
                    isEndOfListReached: true
        '400':
          description: |-
            #### Некорректный запрос.

            Коды ошибок блока errors:
              - `Required` - не передано обязательное поле
              - `ValueTooSmall` - значение меньше минимально допустимого
              - `ValueTooLarge` - значение превышает максимально допустимое
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorContractBadRequest'
        '401':
          description: '#### Пользователь не авторизован'
        '403':
          description: |-
            #### Недостаточно прав

            Коды ошибок:
            - `InsufficientRoles` - отсутствует необходимая роль для выполнения запроса
            - `InsufficientScopes` - нет доступа к api. В токене не передан необходимый scope
            - `NoAccessToUnit` - нет доступа к заведению
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorContract'
        '404':
          description: |-
            #### Мануфактура не найдена

            Возвращается если мануфактуры с переданным manufactureId не существует
        '500':
          description: |-
            #### Внутренняя ошибка сервера

            Коды ошибок:
             - `InternalError` - внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorContract'
      security:
        - Dodo oauth2:
            - 'accounting:manufacture'
