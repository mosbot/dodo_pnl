                  третья передана с `quantity: 0`. Обе неотправленные позиции не будут отправлены и останутся
                  в перемещении с количеством `0`.
                value:
                  at: '2026-06-26T10:00:00.000000Z'
                  items:
                    - stockItemId: 0198f3c2a1b2c3d4e5f6a7b8c9d0e1f2
                      quantity: 12
                      totalPriceWithVat: 120
                      totalPriceWithoutVat: 100
                      unitPriceWithVat: 10
                      unitPriceWithoutVat: 8.33
                      vatRate: 20
                    - stockItemId: 0398f3c2a1b2c3d4e5f6a7b8c9d0e1f4
                      quantity: 0
                      totalPriceWithVat: 0
                      totalPriceWithoutVat: 0
                      unitPriceWithVat: 0
                      unitPriceWithoutVat: 0
                      vatRate: 20
      responses:
