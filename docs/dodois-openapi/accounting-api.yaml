                      - documentId: 000d3a240c719a8711e68aba13f7f862
                        documentType: Supply
                        documentVersion: 1
                        modifiedByUserId: 000d3a240c719a8711e68aba13f7f862
                        modifiedAt: '2011-08-01T18:31:42'
                        unitId: 000d3a240c719a8711e68aba13f7f862
                        unitName: Сыктывкар-1
                        changes:
                          - Дата счета-фактуры была изменена с 09.02.2026 на 10.02.2026.
                        componentChanges:
                          - documentItemId: 000d3a240c719a8711e68aba13f7f862
                            changes:
                              - 'Запись добавлена Тесто 20 \"Плюшка 20\" - 176 шт, сумма без НДС - 725,12, сумма НДС - 0,00, сумма с НДС - 725,12, цена за единицу шт, цена за 1 кг — 4,12.'
