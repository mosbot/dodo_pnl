  /staff/members:
    get:
      summary: Команда → Список сотрудников
      responses:
        '200':
          description: Успешное выполнение запроса
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffMembersResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: string
                example: '''HiredFrom'' should be greater than ''HiredTo'''
                description: Сообщение об ошибке
        '401':
          description: '#### Пользователь не авторизован'
        '403':
          $ref: '#/components/responses/PersonalDataForbidden'
        '500':
          description: Internal Server Error
      operationId: get-staff-members
      parameters:
        - schema:
            type: string
            enum:
              - Operator
              - KitchenMember
              - Courier
              - Cashier
              - PersonalManager
            example: KitchenMember
          example: KitchenMember
          in: query
          name: staffType
          description: Тип сотрудников
        - schema:
            type: string
            example: 'Suspended,Dismissed'
          in: query
          name: statuses
          description: 'Состояние сотрудников. Можно указать несколько значений для поиска, перечислив их через запятую. Разрешенные значения: `Dismissed` - уволен, `Suspended` - отстранен, `Active` - работает.'
        - schema:
            type: string
            format: date
            example: '2022-10-20'
          in: query
          name: hiredFrom
          description: 'Фильтр по дате трудоустройства сотрудников, начало диапазона'
        - schema:
            type: string
            format: date
            example: '2022-10-27'
          in: query
          name: hiredTo
          description: 'Фильтр по дате трудоустройства сотрудников, конец диапазона'
        - $ref: '#/components/parameters/skip'
        - $ref: '#/components/parameters/take'
        - schema:
            type: string
            format: date
            example: '2022-10-20'
          in: query
          name: dismissedFrom
          description: 'Фильтр по дате увольнения сотрудников, начало диапазона'
        - schema:
            type: string
            format: date
            example: '2022-10-27'
          in: query
          name: dismissedTo
          description: 'Фильтр по дате увольнения сотрудников, конец диапазона'
        - schema:
            type: string
            example: '000d3a240c719a8711e68aba13f7f862,000d3a240c719a8711e68aba13f7fc8a,000d3a240c719a8711e68aba13f7fe13'
          in: query
          name: units
          description: Список заведений (пиццерий) Dodo IS в формате UUID
        - schema:
            type: string
            format: date
            example: '2022-11-20'
          in: query
          name: lastModifiedFrom
          description: 'Фильтр по дате изменения, начало диапазона'
        - schema:
            type: string
            format: date
            example: '2022-11-27'
          in: query
          name: lastModifiedTo
          description: 'Фильтр по дате изменения сотрудников, конец диапазона'
      description: |-
        Возвращает список сотрудников, отсортированный по дате трудоустройства (`hiredOn`).

        ### Требования к query параметрам:
        - фильтр по типу должности `staffType` применяется только по одному значению
        - фильтр по статусу `statuses` применяется по нескольким значениям (указывается через запятую без пробелов)
        - фильтр по дате трудоустройства `hiredFrom/hiredTo`, применяется как по промежутку дат, так и по отдельным from/to датам
        - фильтр по дате увольнения `dismissedFrom/dismissedTo`, применяется как по промежутку дат, так и по отдельным from/to датам
        - фильтр по дате изменения `lastModifiedFrom/lastModifiedTo`, применяется как по промежутку дат, так и по отдельным from/to датам
        - фильтр по заведениям `units` применяется по нескольким значениям; если не указан, то будут выданы записи по всем доступным для пользователя заведениям
        - фильтр `skip` должен быть больше 0, иначе возвращается 400
        - фильтр `take` должен быть больше 0 и меньше либо равен 1000, иначе возвращается 400
        - фильтр `hiredFrom` должен быть не больше `hiredTo`, иначе возвращается 400
        - фильтр `dismissedFrom` должен быть не больше `dismissedTo`, иначе возвращается 400
        - фильтр `lastModifiedFrom` должен быть не больше `lastModifiedTo`, иначе возвращается 400
        - разрешенные значения для фильтров `staffType`, `statuses` указаны в их описаниях

        > #### Доступно для следующих ролей:
        >
        >   `Division administrator` - Администратор подразделения
        >
        >   `Store Manager` - Менеджер офиса
        >
        >   `Shift supervisor` - Менеджер смены
      security:
        - Authorization:
            - 'staffmembers:read'
            - 'user.role:read'
      tags:
        - Команда
    parameters: []
  /staff/incentives/premium/one-time:
    post:
      summary: Команда → Премия единоразовая
      operationId: post-staff-incentives-premium-one-time
      security:
        - Authorization:
            - incentives
            - 'user.role:read'
      description: |-
        Метод позволяет назначить единоразовую премию сотруднику.

        ### Требования к query параметрам:
        1. Параметр `onLocal` может принимать дату и время в пределах текущего отчетного периода заведения, где работает сотрудник (по стандарту — до 5-го числа месяца, следующего за отчётным периодом). Например, если отчетный период для заведения закрывается 5-го числа, то:
           - если текущая дата ≤ 5-го числа, премии можно начислять, начиная с 1-го числа предыдущего месяца.
           - если текущая дата > 5-го числа, премии можно начислять, начиная с 1-го числа текущего месяца.
        2. Значение параметра `onLocal` не может быть позже текущего времени заведения, в котором работает сотрудник.

        > #### Доступно для следующих ролей:
        >
        >   `Store Manager` - Менеджер офиса
        >
        >   `Division administrator` - Администратор подразделения
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                staffId:
                  type: string
                  format: uuid
                  description: Идентификатор сотрудника
                  example: 000d3a240c719a8711e68aba13f7fe13
                  pattern: '[0-9a-f]{32}'
                  minLength: 32
                  maxLength: 32
                onLocal:
                  type: string
                  format: date-time
                  description: Дата премии в локальном времени
                  example: '2023-11-15T09:00:00'
                amount:
                  type: number
                  format: double
                  description: Сумма премии
                  example: 1000.5
                  minimum: 0
                  exclusiveMinimum: true
                comment:
                  type: string
                  description: Комментарий к премии
                  example: Премия за отличную работу
              required:
                - staffId
                - onLocal
                - amount
      responses:
        '204':
          description: Премия успешно добавлена
        '400':
          description: |-
            #### Некорректный запрос.

            Коды ответа:
            - `ValidationError` - передан некорректный запрос
            - `PremiumInPast` - добавление премии за предел отчетного месяца в прошлое
            - `PremiumInFuture` - добавление премии в будущем

            Коды ошибок блока `details.errors`:
            - `Required` - не передано обязательное поле
            - `InvalidInput` - передано невалидное значение для параметра
            - `NegativeValue` - передано отрицательное значение для параметра принимающего только положительные числа
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorContractBadRequest'
        '401':
          description: '#### Не авторизован'
        '403':
          description: |-
            #### Недостаточно прав

            Коды ошибок:

            - `InsufficientRoles` - отсутвует необходимая роль для выполнения запроса
            - `InsufficientScopes` - нет доступа к api. В токене не передан необходымый scope.
            - `NoAccessToUnit` - нет доступа к заведению
            - `NoAccessToStaffMember` - сотрудник не найден или нет доступа к сотруднику
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorContract'
        '500':
          description: |-
            #### Внутренняя ошибка сервера

            Коды ошибок:
             - `InternalError` - внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorContract'
      tags:
        - Команда
