          application/json:
            schema:
              type: object
              properties:
                writeOffs:
                  type: array
                  x-stoplight:
                    id: tau2epiup9lvq
                  items:
                    x-stoplight:
                      id: aa8otzosmykoz
                    type: object
                    maxProperties: 10
                    properties:
                      unitId:
                        $ref: '#/components/schemas/UnitId'
                      stockItemId:
                        $ref: '#/components/schemas/StockItemId'
                      productId:
                        $ref: '#/components/schemas/ProductId'
                      reason:
                        $ref: '#/components/schemas/WriteOffReason'
                      quantity:
                        type: number
                        x-stoplight:
                          id: f011cmiigh0qi
                        description: Количество
                        example: 2.345
                      measurementUnit:
                        $ref: '#/components/schemas/MeasurementUnit'
                      comment:
                        type: string
                        x-stoplight:
                          id: spcaxle1h5oqh
                        example: Дегустация
                        description: Комментарий
                        maxLength: 255
                        nullable: true
                    required:
                      - unitId
                      - reason
                      - quantity
                      - measurementUnit
      description: |-
        Метод позволяет создать списание продукта или сырья.

        ### Требования к входным параметрам:
        - В одном запросе можно передать до 10 записей.
        - Для каждой операции списания необходимо указать либо идентификатор продукта (`productId`), либо идентификатор сырья (`stockItemId`).
        - Параметр `measurementUnit` должен соответствовать единице измерения указанного продукта или сырья.
        - Если вы списываете продукт, в `measurementUnit` следует указывать значение `Quantity`.
        - Для `measurementUnit` со значениями `Quantity` и `Meter`, значение `quantity` должно быть целым числом.
        - Для `measurementUnit` со значениями `Kilogram` и `Liter`, значение `quantity` может быть дробным числом с точностью до трех знаков после запятой (например, до граммов или миллилитров).
        - Максимальная длинна `comment` 255 символов.
        - Причина списания (`reason`) должна быть разрешена для указанного заведения (`unitId`). Доступность причин может отличаться для разных заведений.
         
        > #### Доступно для следующих ролей:
