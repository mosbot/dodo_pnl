paths:
  /production/orders-handover-time:
    parameters: []
    get:
      summary: Производство → Время выдачи заказа
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ordersHandoverTime:
                    type: array
                    description: Время выдачи заказа
                    items:
                      $ref: '#/components/schemas/HandoverTime'
                required:
                  - ordersHandoverTime
        '400':
          description: Bad Request (from or to parameter is missing)
        '401':
          description: '#### Пользователь не авторизован'
        '429':
          description: Too Many Requests
      operationId: get-production-ordershandovertime
      description: |-
        Возвращает время выдачи заказов за выбранный период по пиццериям (`units`).

        ### Требования к query параметрам:
        1. В `units` можно перечислить до 30 заведений в одном запросе;
        2. В `units` следует перечислять UUID-ы строго через запятую без пробелов;
        3. Диапазон дат между `to` и `from` параметрами не должен превышать 31 день.

        ### Округление до целых секунд:
        Длительность событий (например, `cookingTime`) представлена целыми числами и округляется до целых секунд.
        0.5 и больше секунд округляется вверх, 0.4 и меньше - вниз.

        ### Исключенные данные:
        Напитки и неприготовляемые продукты исключаются из выборки.
        В расчет не попадают заказы с временем приготовления выпекаемых продуктов меньше 1 минуты, заказы без выпекаемых продуктов (кусочки, напитки, фонданы и т.д.) и заказы с временем выдачи больше 1 часа.

        > #### Доступно для следующих ролей:
        >
        >   `Division administrator` - Администратор подразделения
        >
        >   `Store Manager` - Менеджер офиса
      parameters:
        - $ref: '#/components/parameters/units'
        - schema:
            type: string
            format: date-time
            example: '2011-08-01T18:31:42'
          in: query
          name: from
          required: true
          description: Начало периода в формате ISO 8601
          style: form
        - schema:
            type: string
            format: date-time
            example: '2011-09-02T19:21:53'
          in: query
          name: to
          required: true
          description: Конец периода в формате ISO 8601
          style: form
      x-internal: false
      security:
        - Authorization:
            - productionefficiency
            - 'user.role:read'
      tags:
        - Производство
  /orders/clients-statistics:
    parameters: []
    get:
      summary: Заказы → Статистика по новым клиентам
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  newClientsCount:
                    type: integer
                    x-stoplight:
                      id: bf8vjxb3scw9n
                    description: Количество новых клиентов
                  dineInNewClientsCount:
                    type: integer
                    x-stoplight:
                      id: bf8vjxb3scw9n
                    description: Количество новых клиентов в заведении
                  deliveryAndTakeawayNewClientsCount:
                    type: integer
                    x-stoplight:
                      id: bf8vjxb3scw9n
                    description: Количество новых клиентов на доставку/самовывоз
                  oldClientsCount:
                    type: integer
                    x-stoplight:
                      id: bf8vjxb3scw9n
                    description: Количество старых клиентов
                required:
                  - newClientsCount
                  - dineInNewClientsCount
                  - deliveryAndTakeawayNewClientsCount
                  - oldClientsCount
        '400':
          description: |-
            #### Некорректный запрос.

            Коды ответа:

            - `ValidationError` - передан некорректный запрос
            Коды ошибок блока `details.errors`:

            - `Required` - не передано обязательное поле.
            - `InvalidInput` - передано невалидное значение для параметра
            - `DateOutOfRange` - невозможность построения прогноза на переданную дату
            - `TooManyUnits` - количество переданных заведений превышает лимит в одном запросе
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorContractBadRequest'
        '401':
          description: '#### Пользователь не авторизован'
        '403':
          description: |-
            #### Недостаточно прав


            Коды ошибок:
            - `InsufficientRoles` - отсутвует необходимая роль для выполнения запроса
            - `InsufficientScopes` - нет доступа к api. В токене не передан необходымый scope.
            - `NoAccessToUnit` - нет доступа к заведению
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorContract'
        '500':
          description: |-
            #### Внутренняя ошибка сервера

            Коды ошибок:
             - `InternalError` - внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorContract'
      operationId: get-orders-client-statistics
      description: |-
        Получение статистики по клиентам в заведении.
        Возвращает информацию о новых клиентах в заведении и на достаку.
        Так же информацию о старых клиентах.

        ### Требования к query параметрам:
        1. В `units` можно перечислить до 30 заведений в одном запросе;
        2. В `units` следует перечислять UUID-ы строго через запятую без пробелов;
        3. `fromDate` должен быть меньше или равен `toDate`.
        4. Максимальный период запроса - 31 день

        > #### Доступно для следующих ролей:
        >
        >   `Division administrator` - Администратор подразделения
        >
        >   `Store Manager` - Менеджер офиса
        >    
        >   `Shift supervisor` - Менеджер смены
      parameters:
        - $ref: '#/components/parameters/units'
        - $ref: '#/components/parameters/fromDate'
        - $ref: '#/components/parameters/toDate'
      x-internal: false
      security:
        - Authorization:
            - orders
            - 'user.role:read'
      tags:
        - Заказы
  /production/tracking-metrics/summary:
    get:
      summary: Производство → Метрики с трекинга (Сводные)
      description: |-
        Позволяет получить сводную информацию о времени, проведенном продуктом на различных станциях производства за указанный период.

        При запросе за определенный период (`from`, `to`) и запросе по нескольким заведениям (`units`), будет возвращено среднее значение по каждому продукту за весь интервал from to отдельно для каждого заведения.

        ### Требования к query параметрам: 
        1. В `units` можно передать 1 заведение;
        3. В `products` можно перечислить до 30 продуктов в одном запросе; 
        4. В `products` следует перечислять UUID-ы строго через запятую без пробелов; 
        5. Диапазон дат между `toDate` и `fromDate` параметрами не должен превышать 7 деней.
        6. В ответе будет отображаться информация за период `fromDate`-`toDate` включительно `fromDate`.
        7. Если нужно получить данные за один день укажите `fromDate` = `toDate`.

        >#### Доступно для следующих ролей: 
        >   `Division administrator` - Администратор подразделения 
        >
        >   `Store Manager` - Менеджер офиса 
        >
        >   `Shift supervisor` - Менеджер смены
      security:
        - Authorization:
            - productionefficiency
            - 'user.role:read'
      parameters:
        - $ref: '#/components/parameters/units'
        - $ref: '#/components/parameters/skip'
        - $ref: '#/components/parameters/take'
        - $ref: '#/components/parameters/fromDate'
        - $ref: '#/components/parameters/toDate'
        - $ref: '#/components/parameters/products'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    $ref: '#/components/schemas/TrackingMetricsSummaryResult'
                  isEndOfListReached:
                    type: boolean
                    description: Признак достижения конца списка
                required:
                  - result
                  - isEndOfListReached
        '400':
          description: |-
            #### Некорректный запрос.

            Коды ответа: 

            - `ValidationError` - передан некорректный запрос
            Коды ошибок блока `details.errors`: 
            - `Required` - не передано обязательное поле 
            - `InvalidInput` - передано невалидное значение для параметра 
            - `UnitNotFound` - заведение не найдено 
            - `TooManyUnits` - количество переданных заведений превышает лимит в одном запросе 
            - `ToManyProducts` - количество переданных продуктов превышает лимит в одном запросе 
            - `DateOutOfRange` - превышен максимальный временной период запрос
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorContractBadRequest'
        '401':
          description: '#### Пользователь не авторизован'
        '403':
          description: |-
            #### Недостаточно прав

            Коды ошибок:
            - `InsufficientRoles` - отсутвует необходимая роль для выполнения запроса
            - `InsufficientScopes` - нет доступа к api. В токене не передан необходымый scope.
            - `NoAccessToUnit` - нет доступа к заведению
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorContract'
        '500':
          description: |-
            #### Внутренняя ошибка сервера

            Коды ошибок:
            - `InternalError` - внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorContract'
      operationId: get-production-tracking-metrics-summary
      tags:
        - Производство
  /production/orders-handover-statistics:
    get:
      summary: Производство → Статистика выдачи заказов
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ordersHandoverStatistics:
                    type: array
                    description: Статистика выдачи заказов
                    items:
                      $ref: '#/components/schemas/OrdersHandoverStatistics'
        '400':
          description: Bad Request
        '401':
          description: '#### Пользователь не авторизован'
        '403':
          description: Forbidden
        '429':
          description: Too Many Requests
        '500':
          description: Internal Server Error
      operationId: get-production-orders-handover-time-statistics
      description: |-
        Возвращает агрегированные данные по выдаче заказов за выбранный период по пиццериям (`units`).

        ### Требования к query параметрам:
        1. В `units` можно перечислить до 30 заведений в одном запросе;
        1. В `units` следует перечислять UUID-ы строго через запятую без пробелов;
        1. В `salesChannels` следует перечислять каналы продаж (Delivery,DineIn,TakeAway) строго через запятую без пробелов;
        1. Диапазон дат между `to` и `from` параметрами не должен превышать 31 день.

        ### Округление до целых секунд:
        Длительность событий (например, `avgCookingTime`) представлена целыми числами и округляется до целых секунд.
        0.5 и больше секунд округляется вверх, 0.4 и меньше - вниз.

        ### Исключенные данные:
        Напитки и неприготовляемые продукты исключаются из выборки.
        В расчет не попадают заказы с временем приготовления выпекаемых продуктов меньше 1 минуты, заказы без выпекаемых продуктов (кусочки, напитки, фонданы и т.д.) и заказы с временем выдачи больше 1 часа.
      parameters:
        - $ref: '#/components/parameters/units'
        - $ref: '#/components/parameters/from'
        - $ref: '#/components/parameters/to'
        - schema:
            type: string
            example: 'Delivery,DineIn,TakeAway'
          in: query
          name: salesChannels
          description: Фильтр по типу заказа Доставка/Ресторан/Самовывоз
      security:
        - Authorization:
            - productionefficiency
            - 'user.role:read'
      tags:
        - Производство
    parameters: []
  /production/productivity:
    parameters: []
    get:
      summary: Производство → Производительность
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  productivityStatistics:
                    type: array
                    description: Статистика производительности по пиццериям
                    items:
                      $ref: '#/components/schemas/ProductivityStatistics'
                required:
                  - productivityStatistics
        '400':
          description: Bad Request (from or to parameter is missing or not rounded to hour)
        '401':
          description: '#### Пользователь не авторизован'
      operationId: get-staff-productivity
      description: |-
        Возвращает метрики производительности за выбранный период и указанным пиццериям (`units`).

        ### Требования к query параметрам:
        1. В `units` можно перечислить до 30 заведений в одном запросе;
        1. В `units` следует перечислять UUID-ы строго через запятую без пробелов;
        1. Диапазон дат между `from` и `to` параметрами не должен превышать 31 день;
        1. Даты `from` и `to` должны быть округлены до часов.


        Как расчитывается показатель «Скорость»

        Скорость — процент продуктов, изготовленных быстрее установленного стандартного времени. Для расчета скорости количество продуктов, приготовленных вовремя за период, делится на общее количество продуктов за этот период.<br />
        ⚠️ Скорость за день не считается, как средняя скоростей за смены.

        *Смена 1: вовремя приготовили 10 продуктов, всего — 100. Скорость за смену 10 / 100 = 10%.*<br />
        *Смена 2: вовремя приготовили 50 продуктов, всего — 150. Скорость за смену 50 /150 = 30%.*<br />
        *Показатель скорость будет = (10 + 50) / (100 + 150) = 24. Если вы посчитаете среднее по сменам, то результат будет некорректный (10 + 30) / 2 = 20.*

        **Важное замечание:** Не учитываются отмененные заказы (State != 12)
      parameters:
        - $ref: '#/components/parameters/units'
        - schema:
            type: string
            format: date-time
            example: '2011-08-01T18:00:00'
            pattern: '^\d{4}-\d{2}-\d{2}T\d{2}:00:00$'
          in: query
          name: from
          required: true
          description: Начало периода в формате ISO 8601 округлённого до часов
          style: form
        - schema:
            type: string
            format: date-time
            example: '2011-09-02T19:00:00'
            pattern: '^\d{4}-\d{2}-\d{2}T\d{2}:00:00$'
          in: query
          name: to
          required: true
          description: Конец периода в формате ISO 8601 округлённого до часов
          style: form
      security:
        - Authorization:
            - productionefficiency
            - 'user.role:read'
      tags:
        - Производство
  /production/stop-sales-channels:
    get:
      summary: Производство → Стоп-продажи по каналам продаж
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  stopSalesBySalesChannels:
                    description: Данные о стопах продаж сгруппированные по заведениям и каналам продаж
                    type: array
                    items:
                      $ref: '#/components/schemas/StopSalesBySalesChannelsItem'
                required:
                  - stopSalesBySalesChannels
              examples: {}
        '400':
          description: Bad Request (from or to parameter is missing)
        '401':
          description: '#### Пользователь не авторизован'
      operationId: get-production-stop-sales-saleschannels
      parameters:
        - $ref: '#/components/parameters/units'
        - schema:
            type: string
            example: '2011-08-01T18:31:42'
            format: date-time
          in: query
          name: from
          required: true
          description: Начало периода в формате ISO 8601
          style: form
        - schema:
            type: string
            example: '2011-09-02T19:21:53'
            format: date-time
          in: query
          name: to
          required: true
          description: Конец периода в формате ISO 8601
          style: form
      description: |-
        Возвращает данные о стопах продаж за период для набора пиццерий (`units`).
        Стопы сгруппированы по пиццериям и каналам продаж: доставка, самовывоз, ресторан.

        ### Требования к query параметрам:
        1. В `units` можно перечислить до 30 заведений в одном запросе;
        2. В `units` следует перечислять UUID-ы строго через запятую без пробелов;
        3. Диапазон дат между `to` и `from` параметрами не должен превышать 31 день.

        > #### Доступно для следующих ролей:
        >
        >   `Division administrator` - Администратор подразделения
        >
        >   `Store Manager` - Менеджер офиса
        >
        >   `Shift supervisor` - Менеджер смены
      security:
        - Authorization:
            - stopsales
            - 'user.role:read'
      tags:
        - Производство
    parameters: []
  /production/stop-sales-ingredients:
    get:
