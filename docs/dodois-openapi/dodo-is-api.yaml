             - `ValidationError` - передан некорректный запрос


            Коды ошибок блока `details.errors`:
             - `Required` - не передано обязательное поле
             - `InvalidInput` - передано невалидное значение для параметра
             - `ToMany` - Превышено максимальное количество списаний в одном запросе
             - `StockItemNotFound` - сырье по переданному `stockItemId` не найдено
             - `ProductNotFound` - продукт по переданному `productId` не найден
             - `InvalidMeasurementUnit` - переданный `MeasurementUnit` не может использоваться в сочетании с `productId` или `stockItemId`
             - `StringTooLong` - Превышена максимальная длина `comment`
             - `ValueTooSmall` - `quantity ` меньше или равен 0
             - `QuantityNotInteger` - `quantity ` должнен быть целым числом
             - `QuantityExceedsDecimalPlaces` - `quantity ` должен содержать не более 3 знаков после запятой
             - `InvalidWriteOffReason` - указанная причина списания (`reason`) не разрешена для данного заведения (`unitId`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorContractBadRequest'
        '401':
          description: '#### Пользователь не авторизован'
        '403':
          description: |-
