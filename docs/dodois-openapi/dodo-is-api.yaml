          description: уникальный идентификатор поездки (за одну поездку может доставляться несколько заказов)
          x-stoplight:
            id: a33i0zd72fq8q
          pattern: '[0-9a-f]{32}'
        unitId:
          type: string
          minLength: 32
          maxLength: 32
          example: 000d3a240c719a8711e68aba13f7fe13
          description: Идентификатор заведения
        unitName:
          type: string
          example: Сыктывкар-1
          description: Название заведения
        staffShiftId:
          type: string
          x-stoplight:
            id: ybpu0d9gnkfpa
          description: Идентификатор смены сотрудника
          minLength: 32
          maxLength: 32
          example: 000d3a240c719a8711e68aba13f7f862
          pattern: '[0-9a-f]{32}'
        handedOverToDeliveryAt:
          type: string
          description: |-
            Время, когда заказ отмечен отправленным в доставку.
            Касса доставки: отправление происходит при отправке с кассы доставки.
            Курьерское приложение: при нажатии кнопки «Поехали»
          format: date-time
          example: '2011-08-01T18:31:42'
        predictedDeliveryTime:
          type: integer
          format: time
          description: |-
            Прогнозное время Яндекса или Google, за которое должен быть доставлен заказ + 4 минуты на действия на адресе заказа: доехать, припарковаться, подняться к клиенту, передать заказ и так далее. Мы выбрали время 4 минуты на основе сравнения факта и прогноза поезди по всей сети.
            В секундах с округлением.
        deliveryTime:
          type: integer
          format: time
          description: |-
            Фактическое время, за которое был доставлен заказ
            В секундах с округлением.
        orderFulfilmentFlagAt:
          type: string
          description: |-
            Время отметки курьером в приложении успешной доставки.
            Возвращает null для заказов через КД
          format: date-time
          example: '2011-08-01T18:31:42'
          nullable: true
        isFalseDelivery:
          type: boolean
          description: |-
            Была ли доставка заказа некорректной.
            Причины некорректных заказов:

            Неверная отметка геолокации: если курьер отметился у клиента в радиусе более, чем 300 метров.

            Не реальное время поездки курьера:

            Заказ выдан через мобильное приложение: если время, когда курьер доставил заказ меньше трети прогноза, то заказ будет некорректным.
            Заказ выдан через кассу доставки: берется время из поездки, а не заказа:
            не было определено прогнозного времени — поездка короче 6 минут считается читом.
            есть прогнозное время поездки и реальная поездка меньше чем прогнозное время деленное пополам.
        deliveryTransportName:
          type: string
          description: 'Вид транспорта курьера. Устанавливается во время отправки заказа через приложение или кассу доставки: авто, пеший, велосипед.'
          enum:
            - Vehicle
            - OnFoot
            - Bicycle
          example: OnFoot
        tripOrdersCount:
          type: integer
          description: 'Количество заказов, которые взял курьер в одну поездку'
        heatedShelfTime:
          type: integer
          description: Время ожидания заказа на тепловой полке в секундах с округлением
        orderAssemblyAvgTime:
          type: integer
          description: |-
            Время сборки заказа, в котором участвует курьер. В секундах с округлением.
            Возможны два случая:

            1. Курьер встал в очередь, и заказ появился после этого. Тогда для расчета метрики берется время которое заказ пролежал на полке. Так как курьер все это время мог собирать заказ.

            2. Курьер встал в очередь после того, как появился заказ. Тогда для расчета метрики берется время с момента постановки в курьера в очередь, до момента, когда заказ отправлен в поездку.
        isProblematicDelivery:
          type: boolean
          description: Были проблемы с доставкой
        problematicDeliveryReason:
          type: string
          description: Причина проблемной доставки
        wasLateDeliveryVoucherGiven:
          type: boolean
          description: Был выдан сертификат за опоздание
        sectorId:
          type: string
          minLength: 32
          maxLength: 32
          format: uuid
          example: 000d3a240c719a8711e68aba13f7fe13
          description: идентификатор сектора
          pattern: '[0-9a-f]{32}'
          nullable: true
        sectorName:
