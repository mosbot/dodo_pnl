        - Допустимые каналы продаж: Delivery, Dine-in, Takeaway
        - Допустимые источники заказов: CallCenter, Website, Dine-in, MobileApp, Manager, Aggregator, Kiosk, ChatBot
        - Допустимые виды платежей: Online, Cash, Card, Aggregator
        - Не учитываются заказы, которые созданы как замена бракованных заказов
        - Источник заказа Dine-in или Manager - это вероятнее всего будет касса ресторана.
        - В ответе возвращаются только ненулевые значения по комбинациям каналов продаж, источников заказов и видов платежей

        ### Требования к query параметрам:
        1. `from` должен быть меньше, чем `to`.
        2. Левая граница `from` - включающая, правая `to` - исключающая
        3. Максимальный период запроса - 62 дня
      security:
        - Authorization:
            - shared
      parameters:
        - $ref: '#/components/parameters/from'
        - $ref: '#/components/parameters/to'
  /finances/sales/units:
    get:
      summary: Финансы → Продажи по заведениям за период
      operationId: get-finances-sales-period-units
      tags:
        - Финансы
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: array
                    x-stoplight:
                      id: 7sgnxw0qspy3i
                    minItems: 0
                    uniqueItems: true
                    description: Данные о продажах по заведениям за период
                    items:
                      $ref: '#/components/schemas/SalesDataByUnit'
                required:
                  - result
        '400':
          description: |-
            #### Некорректный запрос.

            Коды ответа:
             - `ValidationError` - передан некорректный запрос

            Коды ошибок блока `details.errors`:
             - `Required` - не передано обязательное поле
             - `InvalidInput` - передано невалидное значение для параметра
             - `DateOutOfRange` - невозможность построения прогноза на переданную дату
             - `NegativeValue` - передано отрицательное значение для параметра принимающего только положительные числа
             - `ValueTooSmall` - переданое значение меньше минимального значения
             - `ValueTooLarge` - переданое значение превышает максимальное значение для параметра
             - `UnitNotFound` - заведение не найдено 
             - `TooManyUnits` - количество переданных заведений превышает лимит в одном запросе
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorContractBadRequest'
        '401':
          description: '#### Пользователь не авторизован'
        '403':
          description: |-
            #### Недостаточно прав


            Коды ошибок:
            - `InsufficientRoles` - отсутвует необходимая роль для выполнения запроса
            - `InsufficientScopes` - нет доступа к api. В токене не передан необходымый scope.
            - `NoAccessToUnit` - нет доступа к заведению
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorContract'
        '500':
          description: |-
            #### Внутренняя ошибка сервера

            Коды ошибок:
             - `InternalError` - внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorContract'
      description: |-
        Возвращает данные продаж по заведениям за указанный период.
        Данные продаж агрегированы по месяцам и разбиты по каналам продаж, источникам заказа и методам оплаты.

        В данных продаж учитываются и возвращаются только заказы с перечисленными условиями:
        - Допустимые каналы продаж: Delivery, Dine-in, Takeaway
        - Допустимые источники заказов: CallCenter, Website, Dine-in, MobileApp, Manager, Aggregator, Kiosk, ChatBot
        - Допустимые виды платежей: Online, Cash, Card, Aggregator
        - Не учитываются заказы, которые созданы как замена бракованных заказов
        - Источник заказа Dine-in или Manager - это вероятнее всего будет касса ресторана.
        - В ответе возвращаются только ненулевые значения по комбинациям каналов продаж, источников заказов и видов платежей

        ### Требования к query параметрам:
        1. `fromDate` должен быть меньше, чем `toDate`.
        2. Левая граница `from` - включающая, правая `to` - исключающая
        3. Максимальный период запроса - 62 дня
        4. В `units` можно перечислить до 30 заведений в одном запросе;
        5. В `units` следует перечислять UUID-ы строго через запятую без пробелов;
      security:
