  /delivery/statistics:
    parameters: []
    get:
      summary: Доставка → Статистика
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  unitsStatistics:
                    type: array
                    description: Основные метрики доставки
                    items:
                      $ref: '#/components/schemas/UnitDeliveryStatistics'
                required:
                  - unitsStatistics
        '400':
          description: Bad Request (from or to parameter is missing)
        '401':
          description: '#### Пользователь не авторизован'
      operationId: get-delivery-statistics
      description: |
        Возвращает основные метрики по доставке за выбранный период по пиццериям (`units`).

        ### Расчет некоторых показателей:
        1. Процент доставки через курьерское приложение = `ordersWithCourierAppCount` / `deliveryOrdersCount`
        2. Количество заказов на курьера в час = `deliveryOrdersCount` / (`couriersShiftsDuration` / 3600)
        3. Загрузка кукрьеров = `tripsDuration` / `couriersShiftsDuration`

        ### Требования к query параметрам:
        1. В `units` можно перечислить до 30 заведений в одном запросе;
        2. В `units` следует перечислять UUID-ы строго через запятую без пробелов;
        3. Диапазон дат между `to` и `from` параметрами не должен превышать 31 день.

        ### Исключенные данные:
        В ответ не попадают заказы с короткими поездками курьеров или быстрым приготовлением продуктов.
      parameters:
        - $ref: '#/components/parameters/units'
        - schema:
            type: string
            format: date-time
            example: '2011-08-01T18:31:42'
          in: query
          name: from
          required: true
          description: Начало периода в формате ISO 8601
          style: form
        - schema:
            type: string
            format: date-time
            example: '2011-09-02T19:21:53'
          in: query
          name: to
          required: true
          description: Конец периода в формате ISO 8601
          style: form
      x-internal: false
      security:
        - Authorization:
            - deliverystatistics
            - 'user.role:read'
      tags:
        - Доставка
