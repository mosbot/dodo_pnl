    WriteOffReason:
      title: WriteOffReason
      x-stoplight:
        id: ji93o1as8a33k
      type: string
      enum:
        - Expired
        - Defected
        - DamagedPackaging
        - HumanElement
        - Marketing
        - ExpiredShowcaseTime
        - ShowcaseWriteOff
        - DrinkitRemakeForGuest
        - DrinkitStaffTraining
        - DrinkitEmployeeTesting
        - DrinkitProductionNeeds
        - DrinkitMenuDevelopment
        - ManufactureQualityControl
      example: Marketing
      description: |-
        Причина списания.

        **Доступность причин по бизнесам:**

        **Dodo Pizza:**
        - `Expired` - Истёк срок годности
        - `Defected` - Брак
        - `DamagedPackaging` - Повреждённая упаковка
        - `HumanElement` - Человеческий фактор
        - `Marketing` - Маркетинговые активности

        **Drinkit (кофейни):**
        - Все причины Dodo Pizza
        - `DrinkitRemakeForGuest` - Переделка для гостя
        - `DrinkitStaffTraining` - Обучение команды
        - `DrinkitEmployeeTesting` - Тестирование сотрудниками
        - `DrinkitProductionNeeds` - Производственные нужды

        **Drinkit Manufacture (производство):**
        - Все причины Dodo Pizza
        - `DrinkitProductionNeeds` - Производственные нужды
        - `ManufactureQualityControl` - Контроль качества на производстве
        - `DrinkitMenuDevelopment` - Разработка меню
