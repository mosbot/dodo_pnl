  '/staff/members/{id}/suspend':
    parameters:
      - schema:
          type: string
          format: uuid
          example: 000d3a240c719a8711e68aba13f7fe13
        name: id
        in: path
        required: true
        description: id отстраняемого сотрудника
    post:
      summary: Команда → Отстранение сотрудника
      tags:
        - Команда
      operationId: post-staff-members-id-suspend
      responses:
        '200':
          description: Успешное выполнение запроса
        '400':
          description: |-
            Ошибки валидации параметров запроса.
            Возможные варианты ошибок:
              - Parameter 'StaffId' must not be empty;
              - Parameter 'SuspendingFrom' must not be empty;
              - Parameter 'SuspendingFrom' must be greater or equal than to today;
              - Parameter 'SuspendingTo' must be greater or equal than SuspendingFrom;
              - Parameter 'Reason' is not found;
              - Parameter 'Comment' must not be empty and no longer than 255.
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      $ref: '#/components/schemas/Error'
        '401':
          description: '#### Пользователь не авторизован'
        '403':
          description: Отсутствует доступ к сотруднику
        '409':
          description: Статус сотрудника с переданным Id не 'Активен'
      description: |-
        Отстраняет сотрудника по id.

        Отстраненный сотрудник не участвует в штатной деятельности пиццерии:
         - выход на смены;
         - учет в штатных метриках пиццерии (текучесть, укомплектованность и т.д.).

        Отстранить можно только сотрудника, который сейчас находится в статусе Активен.

        Даты и время отстранения, передаваемые в API, ожидаются в UTC и далее будут приведены к локальным датам и времени относительно департамента отстраянемого сотрудника.

        Список идентификаторов причин для отстранения:
         - dc1746fb4916483797b16af1c8eae7a2 - просрочена мед. книжка;
         - 2206cdfd19564b1b9e52afded480d8c0 - отпуск;
         - c3e2ece1c8374e2681ba0750ca65dd82 - больничный;
         - 3f8481fdfa0a4be0b3c0a966c3ad0f39 - просрочено разрешение на работу или регистрация;
         - 64d65e1a72c1472c8a3175d0415e618f - другое.

        > #### Доступно для следующих ролей:
        >
        >   `Division administrator` - Администратор подразделения
        >
        >   `Store Manager` - Менеджер офиса
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StaffMemberSuspend'
      security:
        - Authorization:
            - 'staffmembers:write'
            - 'user.role:read'
