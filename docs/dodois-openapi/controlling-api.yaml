  /ratings/standards/metrics/history:
    get:
      summary: Рейтинги → История метрики рейтинга стандартов
      operationId: get-standards-metric-history
      description: |-
        Возвращает значения метрики по периодам рейтинга стандартов для выбранной пиццерии.

        Идентификатор метрики можно взять из `criteria[].result[]` с `type = Metric` в `/ratings/standards/detalization` — поле `metricId`.

        Периоды, в которых метрика не участвовала в расчёте, в выдачу не попадают: иначе отсутствие данных не отличить от нулевого значения.

        Для неизвестного идентификатора метрики возвращается 400 с кодом ошибки `InvalidInput` и `field: metric`.

        ### Требования к query параметрам:
