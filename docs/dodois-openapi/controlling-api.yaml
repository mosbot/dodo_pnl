              schema:
                $ref: '#/components/schemas/ErrorContract'
    parameters: []
  /checkups:
    get:
      summary: Проверки → Список проверок
      operationId: get-checkups
      description: |-
        Возвращает проверки пиццерий, учтённые в рейтинге клиентского опыта или в рейтинге стандартов.
        Отбор идёт по дате проведения проверки (`startedAtLocal`), а не по границам рейтингового периода, поэтому в выдачу могут попасть проверки из периодов, частично выходящих за запрошенный интервал. Рейтинговый период каждой проверки возвращается в полях `periodFrom` и `periodTo`; вместе с типом рейтинга они период однозначно определяют. Границы `fromDate` и `toDate` включаются целиком: `toDate` захватывает весь указанный день.

        **Важно:** возвращаются только проверки, попавшие в расчёт рейтинга. Отменённые, исключённые из рейтинга и незавершённые проверки в выдачу не входят.

        Проверки аудита территориального управляющего через это API не отдаются.

        Для получения данных необходимо указывать параметр `skip`, смещая его на количество уже полученных записей. Повторять до тех пор, пока не будет достигнут конец списка (`isEndOfListReached = true`).

        ### Требования к query параметрам:
        1. В units можно перечислить до 30 заведений в одном запросе
        2. В units следует перечислять UUID-ы строго через запятую без пробелов
        3. Максимальное количество записей в одном запросе take — 1000
        4. Максимальный запрашиваемый период 1 год.
      security:
        - Dodo oauth2:
            - shared
      parameters:
        - $ref: '#/components/parameters/units'
        - $ref: '#/components/parameters/fromDate'
        - $ref: '#/components/parameters/toDate'
        - $ref: '#/components/parameters/ratingKind'
        - $ref: '#/components/parameters/skip'
        - $ref: '#/components/parameters/take'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  checkups:
                    type: array
                    items:
                      $ref: '#/components/schemas/Checkup'
                  isEndOfListReached:
                    $ref: '#/components/schemas/IsEndOfListReached'
                required:
                  - checkups
                  - isEndOfListReached
        '400':
          description: |-
            Некорректный запрос.

            Коды ответа:
             - `ValidationError` - передан некорректный запрос

            Коды ошибок блока details.errors:
             - `InvalidInput` - передано невалидное значение для параметра
             - `TooManyUnits` - количество переданных заведений превышает лимит в одном запросе
             - `NegativeValue` - передано отрицательное значение для параметра принимающего только положительные числа
             - `ValueTooLarge` - переданое значение превышает максимальное значение для параметра
             - `ValueTooSmall` - переданое значение меньше минимального значения
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorContractBadRequest'
        '403':
          description: |-
            Недостаточно прав


            Коды ошибок:
            - `InsufficientRoles` - отсутвует необходимая роль для выполнения запроса
            - `InsufficientScopes` - нет доступа к api. В токене не передан необходымый scope.
            - `NoAccessToUnit` - нет доступа к заведению
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorContract'
        '500':
          description: |-
            Внутренняя ошибка сервера

            Коды ошибок:
             - `InternalError` - внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorContract'
    parameters: []
  '/checkups/{checkupId}':
    get:
      summary: Проверки → Детали проверки
      operationId: get-checkup-details
      description: |-
        Возвращает детали одной проверки: заказ, по которому её проводили, фотографии, зафиксированные замечания и комментарии.

        Каждое замечание в `remarks` относится к одному или нескольким критериям рейтинга. В `remarks[].criteria[].result` возвращается балл, снятый по критерию **именно в этой проверке**, а не итог критерия за период.

        Идентификаторы проверок можно получить в `/checkups`.

        ### Ограничения:
        Доступны только проверки рейтинга клиентского опыта и рейтинга стандартов. Для неизвестного или недоступного идентификатора возвращается 400 с кодом ошибки `InvalidInput` и `field: checkupId`.
      security:
        - Dodo oauth2:
            - shared
      parameters:
        - schema:
            type: string
            pattern: '[0-9a-f]{32}'
            minLength: 32
            maxLength: 32
            example: 2a69836ab8f583ec11ed90098ae24dff
          in: path
          name: checkupId
          description: Идентификатор проверки в формате UUID
          required: true
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckupDetails'
        '400':
          description: |-
            Некорректный запрос.

            Коды ответа:
             - `ValidationError` - передан некорректный запрос

            Коды ошибок блока details.errors:
             - `Required` - обязательный параметр не передан
             - `InvalidInput` - проверка не найдена или недоступна через это API
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorContractBadRequest'
        '403':
          description: |-
            Недостаточно прав


            Коды ошибок:
            - `InsufficientRoles` - отсутвует необходимая роль для выполнения запроса
            - `InsufficientScopes` - нет доступа к api. В токене не передан необходымый scope.
            - `NoAccessToUnit` - нет доступа к заведению
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorContract'
        '500':
          description: |-
            Внутренняя ошибка сервера

            Коды ошибок:
             - `InternalError` - внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorContract'
    parameters: []
