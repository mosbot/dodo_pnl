          in: query
          name: units
          description: Список заведений (пиццерий) Dodo IS в формате UUID
      description: |-
        Возвращает информацию о рейтинге стандартов пиццерий за текущий период. Поиск осуществляется по параметру units или countryCode. 

        Для получения данных необходимо указывать параметр `skip`, смещая его на количество уже полученных записей. Повторять до тех пор, пока не будет достигнут конец списка (`isEndOfListReached = true`).

        ### Требования к query параметрам:
