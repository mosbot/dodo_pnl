      description: |-
        Возвращает самые частые нарушения рейтинга стандартов выбранной пиццерии за запрашиваемый период, отсортированные по количеству по убыванию.

        Учитываются только ответы тех критериев, которые действительно сняли баллы. Исключённые из расчёта ответы не считаются.

        ### Требования к query параметрам:
        1. В unit можно передать одно заведение в одном запросе
        2. Максимальный запрашиваемый период 1 год
        3. Значение top — от 1 до 100
      security:
        - Dodo oauth2:
            - shared
      parameters:
