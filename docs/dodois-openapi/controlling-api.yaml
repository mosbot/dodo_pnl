        - $ref: '#/components/parameters/toDate'
        - $ref: '#/components/parameters/skip'
        - $ref: '#/components/parameters/take'
      description: |-
        Возвращает информацию о рейтинге клиентского опыта пиццерий за запрашиваемый период. 
        В ответе вернутся периоды равные 1 недели со значением рейтинга в данный период.

        **Важно:** Возвращаются только рассчитанные и опубликованные рейтинговые периоды. Периоды в праздничные дни могут отсутствовать.

        Для получения данных необходимо указывать параметр `skip`, смещая его на количество уже полученных записей. Повторять до тех пор, пока не будет достигнут конец списка (`isEndOfListReached = true`).

